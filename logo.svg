<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TeeSync">
  <!-- App icon background -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="#2F3E2B"/>
  <rect x="3" y="3" width="506" height="506" rx="111" fill="none" stroke="#1E2A1B" stroke-width="6"/>

  <!-- Sync arcs — gaps and arrowheads land at 1 o'clock and 7 o'clock -->
