    <circle cx="216" cy="168" r="8"/>
    <circle cx="250" cy="156" r="8"/>
    <circle cx="284" cy="168" r="8"/>
    <circle cx="306" cy="194" r="8"/>
    <circle cx="208" cy="202" r="8"/>
    <circle cx="242" cy="192" r="8"/>
    <circle cx="276" cy="200" r="8"/>
    <circle cx="220" cy="238" r="8"/>
    <circle cx="256" cy="228" r="8"/>
    <circle cx="292" cy="234" r="8"/>
    <circle cx="238" cy="268" r="8"/>
    <circle cx="274" cy="266" r="8"/>
  </g>
</svg>
