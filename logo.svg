    <path d="M 422.1 300.5 A 172 172 0 0 1 87.8 291.8"
          fill="none" stroke="#EFF3E8" stroke-width="36"/>
    <path d="M0 40 L-31 -14 L31 -14 Z" transform="translate(87.8 291.8) rotate(168)"/>
  </g>

  <!-- Tee -->
